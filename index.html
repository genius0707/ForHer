<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF8F4">
<title>上线测试</title>
<style>
:root{
  --bg:#FBF8F4;
  --card:#FFFDFB;
  --pink:#F6E3E1;
  --pink-deep:#D9A0A0;
  --ink:#4A4341;
  --ink-2:#8C8179;
  --line:#EDE2D9;
  --ok:#7C9A78;
  --no:#C18585;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:17px;line-height:1.85;
  padding:30px 22px 60px;
  -webkit-text-size-adjust:100%;
  animation:fade .9s ease-out both;
}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}

.wrap{max-width:560px;margin:0 auto}
.head{margin-bottom:26px}
h1{
  font-family:"Songti SC","Noto Serif SC",Georgia,serif;
  font-size:27px;line-height:1.45;margin:0 0 8px;font-weight:600;letter-spacing:.02em;
}
.sub{color:var(--ink-2);font-size:14px;margin:0}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px 20px 18px;
  margin-bottom:16px;
}
.card h2{
  font-size:15px;font-weight:600;margin:0 0 12px;color:var(--pink-deep);
  letter-spacing:.08em;
}
.row{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:14px;padding:9px 0;border-bottom:1px dashed var(--line);
}
.row:last-child{border-bottom:0}
.row .k{color:var(--ink-2);font-size:14px;flex:0 0 auto}
.row .v{text-align:right;font-size:15px;word-break:break-all}
.ok{color:var(--ok)}
.no{color:var(--no)}
.big{font-size:20px;font-weight:600}
pre{
  background:var(--pink);border-radius:12px;padding:12px 14px;margin:10px 0 0;
  font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;
  color:var(--ink);overflow-x:auto;
  font-family:ui-monospace,Menlo,Consolas,monospace;
}
.tip{font-size:13px;color:var(--ink-2);line-height:1.8;margin:10px 0 0}
.foot{text-align:center;color:var(--ink-2);font-size:13px;margin-top:26px}
@media (prefers-reduced-motion:reduce){body{animation:none}}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <h1>上线测试</h1>
    <p class="sub">如果你在微信里能读到这行字，这条路就通了</p>
  </div>

  <div class="card">
    <h2>环境</h2>
    <div class="row"><span class="k">协议</span><span class="v" id="proto">检测中</span></div>
    <div class="row"><span class="k">域名</span><span class="v" id="host">检测中</span></div>
    <div class="row"><span class="k">打开方式</span><span class="v" id="mode">检测中</span></div>
  </div>

  <div class="card">
    <h2>数据读取</h2>
    <div class="row"><span class="k">memo.csv</span><span class="v" id="csvState">读取中…</span></div>
    <div class="row"><span class="k">有效行数</span><span class="v big" id="csvRows">·</span></div>
    <div class="row"><span class="k">列数</span><span class="v" id="csvCols">·</span></div>
    <div class="row"><span class="k">中文编码</span><span class="v" id="csvEnc">·</span></div>
    <pre id="csvPreview">等待数据…</pre>
  </div>

  <p class="tip" id="advice">三项都跳绿，阶段 0 就算通过。有任何一项红了，把这页截图发我。</p>
  <p class="foot">测试页 · 之后会被正式页面覆盖</p>

</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  /* ---------- 1. 环境检测 ---------- */
  var proto = location.protocol;
  var isHttp = proto === 'https:' || proto === 'http:';
  $('proto').textContent = proto.replace(':', '') || '未知';
  $('proto').className = 'v ' + (isHttp ? 'ok' : 'no');
  $('host').textContent = location.host || '无（本地文件）';
  $('host').className = 'v ' + (location.host ? 'ok' : 'no');

  var ua = navigator.userAgent;
  var mode = '普通浏览器';
  if (/MicroMessenger/i.test(ua)) { mode = '微信内置浏览器'; }
  else if (/QQ\//i.test(ua)) { mode = 'QQ 内置浏览器'; }
  $('mode').textContent = mode;
  $('mode').className = 'v ' + (/MicroMessenger|QQ\//i.test(ua) ? 'ok' : 'ok');

  /* ---------- 2. 编码兜底解码 ---------- */
  /* 先用 UTF-8 严格模式解，失败再退 GBK（Excel 另存 CSV 常存成 GBK） */
  function decodeBuffer(buf) {
    try {
      var t = new TextDecoder('utf-8', { fatal: true }).decode(buf);
      return { text: stripBom(t), enc: 'UTF-8' };
    } catch (e1) {
      try {
        var g = new TextDecoder('gbk').decode(buf);
        return { text: stripBom(g), enc: 'GBK（已自动转换）' };
      } catch (e2) {
        return { text: stripBom(new TextDecoder('utf-8').decode(buf)), enc: 'UTF-8（含无法解码字符）' };
      }
    }
  }
  function stripBom(s) { return s.charCodeAt(0) === 0xFEFF ? s.slice(1) : s; }

  /* ---------- 3. CSV 解析（支持引号、字段内逗号、字段内换行） ---------- */
  function parseCSV(text) {
    var rows = [], row = [], field = '', inQuote = false, i = 0, c;
    text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    while (i < text.length) {
      c = text[i];
      if (inQuote) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQuote = false; i++; continue;
        }
        field += c; i++; continue;
      }
      if (c === '"') { inQuote = true; i++; continue; }
      if (c === ',') { row.push(field); field = ''; i++; continue; }
      if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
      field += c; i++;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows.filter(function (r) {
      return r.some(function (v) { return String(v).trim() !== ''; });
    });
  }

  /* ---------- 4. 读取 memo.csv ---------- */
  var csvUrl = 'memo.csv?v=' + Date.now();   /* 带时间戳，绕过缓存 */

  if (!isHttp) {
    $('csvState').textContent = '无法读取（file:// 协议被浏览器拦截）';
    $('csvState').className = 'v no';
    $('csvRows').textContent = '0';
    $('csvRows').className = 'v big no';
    $('csvCols').textContent = '·';
    $('csvEnc').textContent = '·';
    $('csvPreview').textContent = '现在是用本地文件直接打开的，浏览器不允许读取同目录的 memo.csv。\n把这两个文件传到 GitHub Pages 后再打开，就能读到。';
    $('advice').textContent = '这一项红是因为用文件方式打开的。只要部署到 https 上就会变绿。';
  } else {
    fetch(csvUrl, { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) { throw new Error('HTTP ' + res.status); }
        return res.arrayBuffer();
      })
      .then(function (buf) {
        var d = decodeBuffer(buf);
        var rows = parseCSV(d.text);
        var header = rows.shift() || [];
        $('csvState').textContent = '读取成功';
        $('csvState').className = 'v ok';
        $('csvRows').textContent = String(rows.length);
        $('csvRows').className = 'v big ok';
        $('csvCols').textContent = String(header.length) + ' 列';
        $('csvCols').className = 'v ' + (header.length >= 10 ? 'ok' : 'no');
        $('csvEnc').textContent = d.enc;
        $('csvEnc').className = 'v ' + (d.enc.indexOf('GBK') === -1 ? 'ok' : 'no');
        $('csvPreview').textContent = '表头：' + header.join(' | ') + '\n\n' +
          rows.slice(0, 3).map(function (r) { return r.slice(0, 5).join(' | '); }).join('\n');
        $('advice').textContent = '三项都绿，阶段 0 通过。可以开始做正式页面了。';
      })
      .catch(function (err) {
        $('csvState').textContent = '读取失败：' + err.message;
        $('csvState').className = 'v no';
        $('csvRows').textContent = '0';
        $('csvRows').className = 'v big no';
        $('csvPreview').textContent = '可能原因：\n1. memo.csv 没有和 index.html 放在同一层目录\n2. 文件名大小写不一致（要全小写）\n3. 文件还没提交成功\n\n错误：' + err.message;
        $('advice').textContent = '把这一页截图发我，我按错误信息定位。';
      });
  }
})();
</script>
</body>
</html>
